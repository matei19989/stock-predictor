services:
  frontend:
    build: ./src/frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=db;Database=stockpredictor;Username=admin;Password=dev_password
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=StockPredictor
      - Jwt__Audience=StockPredictor
      - Jwt__ExpiryDays=7
      - MlService__BaseUrl=http://ml:8000
      - Hangfire__RefreshCron=0 * * * *
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://frontend:3000
    depends_on:
      - db
      - ml

  ml:
    build: ./src/ml
    ports:
      - "8000:8000"
    environment:
      # Optional: enables GDELT sentiment features. Without this,
      # predictions still work but sentiment features degrade to NaN.
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      # Option 1 (deployment): base64-encoded service account JSON
      - GCP_CREDENTIALS_JSON=${GCP_CREDENTIALS_JSON:-}
      # Option 2 (local Docker): mount ADC credentials from host
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/adc.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/app/credentials/adc.json:ro

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stockpredictor
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

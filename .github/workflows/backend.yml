name: .NET API — Build & Test

on:
  push:
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'
  pull_request:
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/backend/API/StockPredictor.API.csproj

      - name: Build
        run: dotnet build src/backend/API/StockPredictor.API.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/backend/StockPredictor.Tests.Unit/StockPredictor.Tests.Unit.csproj --no-restore --verbosity normal

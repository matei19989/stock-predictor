name: ML Service — Test

on:
  push:
    paths:
      - 'src/ml/**'
      - 'tests/ml/**'
  pull_request:
    paths:
      - 'src/ml/**'
      - 'tests/ml/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/ml/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r src/ml/requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: python -m pytest tests/ml -v

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/stockpredictor
  RG: stockpredictor-rg

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------------------------------------
  # Detect which services changed, so we skip unnecessary builds.
  # -----------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ml: ${{ steps.filter.outputs.ml }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/backend/**'
            ml:
              - 'src/ml/**'
            frontend:
              - 'src/frontend/**'

  # -----------------------------------------------------------
  # Quality gates: lint + typecheck per service. Fail fast so
  # bad PRs never reach the Docker build/deploy jobs.
  # -----------------------------------------------------------
  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      # MSB3277 is a pre-existing project-reference warning on main; excluded so
      # it doesn't block CI while treating all source warnings as errors.
      - run: dotnet build src/backend/StockPredictor.sln -warnaserror -p:WarningsNotAsErrors=MSB3277 --verbosity minimal

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint

  ml-lint:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.5.7
      - run: ruff check src/ml/app

  # -----------------------------------------------------------
  # Backend unit tests — gate deployment on green tests.
  # -----------------------------------------------------------
  backend-test:
    needs: [changes, backend-lint]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test tests/backend/StockPredictor.Tests.Unit/ --verbosity minimal

  # -----------------------------------------------------------
  # ML pytest — gate ML deployment on green tests.
  # -----------------------------------------------------------
  ml-test:
    needs: [changes, ml-lint]
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/ml/requirements.txt
      - run: pip install -r src/ml/requirements.txt
      - run: pip install pytest httpx
      - run: python -m pytest tests/ml -v

  # -----------------------------------------------------------
  # Frontend Vitest — gate frontend deployment on green tests.
  # -----------------------------------------------------------
  frontend-test:
    needs: [changes, frontend-lint]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm test

  # -----------------------------------------------------------
  # Build + push + deploy each service. Only runs on push to
  # main; PR triggers stop at the quality-gate jobs above.
  # -----------------------------------------------------------
  backend:
    needs: [changes, backend-lint, backend-test]
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: src/backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:sha-${{ github.sha }}

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - run: |
          az containerapp update \
            --name backend \
            --resource-group ${{ env.RG }} \
            --image ${{ env.IMAGE_PREFIX }}-backend:sha-${{ github.sha }}

  ml:
    needs: [changes, ml-lint, ml-test]
    if: github.event_name == 'push' && needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: src/ml
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ml:latest
            ${{ env.IMAGE_PREFIX }}-ml:sha-${{ github.sha }}

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - run: |
          az containerapp update \
            --name ml \
            --resource-group ${{ env.RG }} \
            --image ${{ env.IMAGE_PREFIX }}-ml:sha-${{ github.sha }}

  frontend:
    needs: [changes, frontend-lint, frontend-test]
    if: github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: src/frontend
          push: true
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:sha-${{ github.sha }}

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - run: |
          az containerapp update \
            --name frontend \
            --resource-group ${{ env.RG }} \
            --image ${{ env.IMAGE_PREFIX }}-frontend:sha-${{ github.sha }}
